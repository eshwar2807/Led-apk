# ReelPlay update server. The app name is also the public host name
# (https://<app>.fly.dev), and the release workflow builds the app pointed at it,
# so this line is the one place to change it.
app = "reelplay-updates"
primary_region = "iad"  # pick the region nearest your users: fly platform regions

[build]
  dockerfile = "Dockerfile"

# Problem reports sent from the app are kept on a small volume (the release workflow creates
# it). Read them at https://<app>.fly.dev/reelplay/reports?key=<REPORTS_KEY>.
[env]
  REPORTS_DIR = "/data/reports"

[mounts]
  source = "reports"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleeps when idle and wakes on the next request (about a second), which is plenty for an
  # update check and keeps the bill near zero.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
